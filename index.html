<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест: Нормативно-правовое регулирование ЯВД г. Москвы</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; line-height: 1.6; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { color: #1f3c4d; text-align: center; font-size: 24px; margin-bottom: 10px; border-bottom: 2px solid #2ecc71; padding-bottom: 15px; }
        .description { text-align: center; color: #666; margin-bottom: 30px; font-size: 15px; }
        .question-block { background: #fafafa; border-left: 4px solid #34495e; padding: 15px 20px; margin-bottom: 25px; border-radius: 0 6px 6px 0; }
        .question-title { font-weight: 600; font-size: 16px; margin-bottom: 12px; color: #2c3e50; }
        .options label { display: block; position: relative; padding: 10px 10px 10px 35px; margin-bottom: 6px; background: #fff; border: 1px solid #e0e0e0; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .options label:hover { background: #f1f8ff; }
        .options input[type="radio"] { position: absolute; left: 12px; top: 14px; margin: 0; }
        .btn-submit { display: block; width: 100%; background: #2ecc71; color: #fff; border: none; padding: 15px; font-size: 18px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 30px; }
        .btn-submit:hover { background: #27ae60; }
        #result-box { display: none; margin-top: 30px; padding: 20px; background: #ebf5fb; border-radius: 6px; border: 1px solid #aec6cf; text-align: center; }
        #result-text { font-size: 20px; font-weight: bold; color: #2c3e50; }
        .correct-answer { background-color: #d4edda !important; border-color: #c3e6cb !important; color: #155724; }
        .wrong-answer { background-color: #f8d7da !important; border-color: #f5c6cb !important; color: #721c24; }
    </style>
</head>
<body>
<div class="container">
    <h1>Проверочный тест для администраторов ЯВД</h1>
    <div class="description">Контроль знаний правовой и нормативной базы города Москвы</div>
    <form id="quiz-form">
        <div id="quiz-questions"></div>
        <button type="button" class="btn-submit" onclick="checkQuiz()">Проверить результаты</button>
    </form>
    <div id="result-box"><div id="result-text"></div></div>
</div>
<script>
const questionsData = [
    { q: "Какой нормативный документ определяет общие принципы государственного регулирования торговой деятельности в РФ?", a: ["Постановление Правительства Москвы № 172-ПП", "Федеральный закон от 28.12.2009 № 381-ФЗ", "Распоряжение ДТиУ города Москвы № 229"], correct: 1 },
    { q: "Какое Постановление Правительства Москвы утверждает порядок организации ярмарок и продажи товаров на них?", a: ["№ 172-ПП от 04.05.2011", "№ 372-ПП от 03.07.2014", "№ 720 от 10.12.2025"], correct: 0 },
    { q: "На основании какого документа утвержден Административный регламент предоставления госуслуги по предоставлению мест?", a: ["Распоряжение ДТиУ № 535", "Постановление Правительства Москвы № 372-ПП от 03.07.2014", "Приказ ГБУ «Московские ярмарки» № 89"], correct: 1 },
    { q: "Какой документ утверждает стандарты проведения ярмарок на территории города Москвы (требования к покрытию, санитарии)?", a: ["Распоряжение ДТиУ города Москвы от 29.06.2018 № 229", "Федеральный закон № 381-ФЗ", "Приказ ГБУ «Московские ярмарки» № 762"], correct: 0 },
    { q: "В каком документе содержатся формы документов (акт о нарушениях, выписка из Реестра) и ассортиментный перечень?", a: ["Постановление № 172-ПП", "Распоряжение ДТиУ города Москвы от 08.12.2015 № 535", "Приказ ГБУ «Московские ярмарки» № 720"], correct: 1 },
    { q: "Какой приказ ГБУ «Московские ярмарки» регламентирует предоставление мест пенсионерам и (или) инвалидам?", a: ["Приказ от 10.12.2025 № 720", "Приказ от 17.02.2026 № 89", "Приказ от 22.04.2026 № 232"], correct: 1 },
    { q: "Какой документ определяет перечень ярмарок, на площадке которых требуется обязательное присутствие двух администраторов?", a: ["Приказ ГБУ «Московские ярмарки» от 26.12.2025 № 762", "Распоряжение ДТиУ № 229", "Постановление № 372-ПП"], correct: 0 },
    { q: "Согласно Распоряжению ДТиУ № 229, какая информация/оборудование НЕ входит в обязанности по обустройству площадки?", a: ["Обязательный информационный стенд", "Установка капитальных торговых объектов", "Обеспечение биотуалетов и контейнеров для ТКО"], correct: 1 },
    { q: "В соответствии с Распоряжением ДТиУ № 535, к какой группе ассортимента относятся «Сезонные фрукты, ягоды, грибы»?", a: ["Минимальный ассортимент", "Дополнительная группа (по специализации)", "Данная позиция запрещена для продажи"], correct: 1 },
    { q: "Согласно Распоряжению ДТиУ № 535, какая из следующих позиций входит в МИНИМАЛЬНЫЙ ассортимент группы «Мясо-молочная продукция»?", a: ["Пряности (сухие концентраты, приправы)", "Продукты молокосодержащие, спреды", "Мясо и мясные продукты промышленного производства"], correct: 2 },
    { q: "Каким документом торговый перечень был обновлен и дозагружен позицией «Детское питание» в группы «Мясо-молочная продукция» и «Хлеб, продукты»?", a: ["Распоряжением ДТиУ от 10.08.2026 № 149", "Приказом ГБУ «Московские ярмарки» № 232", "Постановлением Правительства Москвы № 172-ПП"], correct: 0 },
    { q: "Какой документ обязывает администратора находиться на площадке всё время работы ярмарки и носить бейдж?", a: ["Постановление Правительства Москвы № 372-ПП", "Распоряжение ДТиУ № 229 (Раздел V Стандарта)", "Федеральный закон № 381-ФЗ"], correct: 1 },
    { q: "Что из перечисленного, согласно Пункту 2.10 Постановления № 372-ПП, является официальным основанием для отказа в предоставлении места?", a: ["Некорректное заполнение, отсутствие мест или повторная заявка", "Отсутствие у заявителя личного автотранспорта", "Подача заявления менее чем за 30 дней"], correct: 0 },
    { q: "На какой минимальный срок должен быть заключен договор аренды земли для проверки документов пенсионера по Приказу № 89?", a: ["Без ограничений по сроку", "Сроком не менее 6 месяцев", "Сроком более или равным 1 году (≥ 1 года)"], correct: 2 },
    { q: "Что происходит со льготным участником (пенсионером/инвалидом) при выявлении нарушений в соответствии с Приказом № 89?", a: ["Выносится устное предупреждение", "Составляется акт, и после согласования нарушитель лишается возможности занимать соцместа в городе", "Налагается штраф на месте"], correct: 1 },
    { q: "На какую статью Федерального закона № 381-ФЗ ссылается Постановление № 172-ПП при описании порядка организации ярмарок?", a: ["Статья 5", "Статья 11", "Статья 22"], correct: 1 },
    { q: "Какой орган исполнительной власти города Москвы осуществляет мониторинг ярмарок согласно Разделу X Постановления № 172-ПП?", a: ["Департамент торговли и услуг города Москвы", "Префектура административного округа", "Управа района"], correct: 0 },
    { q: "Какая организация является организатором ярмарок выходного дня согласно Разделу I (Пункт 4) Постановления № 172-ПП?", a: ["АО «Московские рынки»", "ГБУ «Московские ярмарки»", "Департамент городского имущества"], correct: 1 },
    { q: "Согласно Разделу IV Постановления № 172-ПП (Пункт 25.1), в какой форме предоставляются места для продажи товаров на ЯВД?", a: ["В бумажном виде через МФЦ", "В электронной форме с использованием Портала государственных и муниципальных услуг города Москвы", "Через подачу личного заявления администратору"], correct: 1 },
    { q: "Какой документ устанавливает основания для составления актов (9.1–9.7) и порядок отзыва места на ярмарке?", a: ["Постановление Правительства Москвы № 172-ПП (Пункт 25.10)", "Приказ ГБУ «Московские ярмарки» № 762", "Распоряжение ДТиУ № 229"], correct: 0 },
    { q: "Какой орган осуществляет мониторинг работы ярмарок на внутригородских муниципальных образованиях по Пункту 51 Постановления № 172-ПП?", a: ["Государственная инспекция по недвижимости", "Советы депутатов внутригородских муниципальных образований", "Роспотребнадзор"], correct: 1 },
    { q: "Какая из категорий граждан имеет право подавать заявления на предоставление мест по Административному регламенту (Постановление № 372-ПП)?", a: ["Только юридические лица", "Юридические лица, ИП и граждане (в том числе ЛПХ и садоводы)", "Исключительно граждане с ЛПХ"], correct: 1 },
    { q: "Какие сроки предоставления государственной услуги установлены для первой заявочной кампании (Постановление № 372-ПП, пункт 2.7)?", a: ["3 рабочих дня", "5 календарных дней", "10 календарных дней"], correct: 1 },
    { q: "Что является официальным результатом предоставления госуслуги согласно Пункту 2.11 Административного регламента?", a: ["Устное разрешение администратора", "Выписка из Реестра решений или решение об отказе", "Заключенный бумажный договор"], correct: 1 },
    { q: "К какому разделу Распоряжения ДТиУ № 229 относятся закрепленные обязанности администратора ярмарки?", a: ["Раздел I", "Раздел V", "Раздел VII"], correct: 1 },
    { q: "В соответствии с какими пунктами какого документа администратор проверяет наличие документов и ассортимент участников?", a: ["В соответствии с пунктом 25.9 ППМ № 172-ПП", "В соответствии с Приказом № 720", "В соответствии с Федеральным законом № 381-ФЗ"], correct: 0 },
    { q: "Кто осуществляет контроль за исполнением требований Стандарта со стороны участника регламента организации ЯВД (Распоряжение № 229)?", a: ["Сотрудник полиции", "Администратор площадки", "Представитель торгового профсоюза"], correct: 1 },
    { q: "Какое оборудование НЕ упоминается в Разделе VII Постановления № 172-ПП как обязательное к местам для продажи товаров?", a: ["Единое торговое оборудование и весы на виду", "Холодильники с термометрами и информационная табличка", "Электронный терминал безналичной оплаты для каждого продавца"], correct: 2 },
    { q: "Какие документы, помимо товаросопроводительных и медкнижек, обязаны иметь при себе участники согласно Разделу VIII Постановления № 172-ПП?", a: ["Ветеринарные документы", "Справку о несудимости", "Договор страхования имущества"], correct: 0 },
    { q: "Какое наказание предусмотрено для администратора за невыполнение обязанностей, закрепленных в Стандарте (Распоряжение № 229)?", a: ["Уголовная ответственность", "Дисциплинарная ответственность", "Наказание не предусмотрено нормативными актами"], correct: 1 }
];

const questionsContainer = document.getElementById('quiz-questions');
questionsData.forEach((item, index) => {
    const block = document.createElement('div');
    block.className = 'question-block';
    block.id = `q-block-${index}`;
    let html = `<div class="question-title">${index + 1}. ${item.q}</div><div class="options">`;
    item.a.forEach((option, oIndex) => {
        html += `<label id="label-${index}-${oIndex}"><input type="radio" name="question-${index}" value="${oIndex}"> ${option}</label>`;
    });
    html += '</div>';
    block.innerHTML = html;
    questionsContainer.appendChild(block);
});

function checkQuiz() {
    let score = 0;
    document.querySelectorAll('.options label').forEach(label => { label.className = ''; });
    questionsData.forEach((item, index) => {
        const selectedInput = document.querySelector(`input[name="question-${index}"]:checked`);
        const correctLabel = document.getElementById(`label-${index}-${item.correct}`);
        correctLabel.classList.add('correct-answer');
        if (selectedInput) {
            const userAnswer = parseInt(selectedInput.value);
            if (userAnswer === item.correct) { score++; } else { document.getElementById(`label-${index}-${userAnswer}`).classList.add('wrong-answer'); }
        }
    });
    const resultBox = document.getElementById('result-box');
    resultBox.style.display = 'block';
    document.getElementById('result-text').innerHTML = `Ваш результат: ${score} из ${questionsData.length} правильных ответов.`;
    resultBox.scrollIntoView({ behavior: 'smooth' });
}
</script>
</body>
</html>
